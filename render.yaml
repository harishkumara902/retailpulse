services:
  - type: web
    name: retailpulse
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python data/seed_data.py
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
